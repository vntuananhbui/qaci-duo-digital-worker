# After a reviewed pull request is merged, publish the library QACI Duo reads:
#   main -> `library`      (prod)
#   dev  -> `library-dev`  (dev)
name: Publish library

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-library-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - name: Push dist/ to the library branch
        env:
          TARGET: ${{ github.ref_name == 'main' && 'library' || 'library-dev' }}
        run: |
          header="$(git config --get http.https://github.com/.extraheader)"
          cd dist
          git init -q -b "$TARGET"
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Publish library from ${GITHUB_SHA}"
          git -c http.https://github.com/.extraheader="$header" \
            push -f "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:$TARGET"
