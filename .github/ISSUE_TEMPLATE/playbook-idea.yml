name: Idea
description: Have an idea for a skill or a Digital Worker but no time to write it? Describe it here.
title: "[Idea] "
labels: ["playbook-idea"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: What should the skill or worker get done?
      description: The end result you need, as concretely as possible.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How do you do this today?
      description: The steps, tools and sources you use, and who reviews the result.
  - type: textarea
    id: approvals
    attributes:
      label: What must always wait for a person?
      description: For example sending emails, submitting a paper, deleting data, running costly jobs.
  - type: input
    id: worker
    attributes:
      label: Which worker should carry it?
      description: An existing worker, or a new one you have in mind.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: I have not pasted tokens, passwords or personal data into this issue
          required: true
